name: sale-order

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sale-order-api:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 10000
      SESSION_COOKIE_SECURE: "1"
      ENABLE_FILE_LOGGING: "0"
      READINESS_CHECK_DB: "1"
      REQUIRE_EXTERNAL_DB: "1"

      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in environment or .env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in environment or .env file}
      USER1: ${USER1:?set USER1 in environment or .env file}
      ADMIN_USERS: ${ADMIN_USERS:-admin}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      DATABASE_URL: ${DATABASE_URL:?set Supabase DATABASE_URL in environment or .env file}
      DB_SSLMODE: ${DB_SSLMODE:-require}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-40}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}

      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
      GUNICORN_MAX_REQUESTS_JITTER: ${GUNICORN_MAX_REQUESTS_JITTER:-100}

      DATABASE_FILE: /var/data/order_counter.db
      UPLOAD_FOLDER: /var/data/uploads
      REPORT_FOLDER: /var/data/reports

      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-sale-orders}
    ports:
      - "127.0.0.1:${API_PORT:-10000}:10000"
    volumes:
      - app_data:/var/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/api/v1/health', timeout=5).read()\" || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sale_order}
      POSTGRES_USER: ${POSTGRES_USER:-sale_order}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sale_order_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  caddy:
    image: caddy:2.8-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend

volumes:
  app_data:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
